<text class="t" x="24" y="74"><tspan class="p">~ $</tspan> claude &quot;who is ashish?&quot;</text><rect class="c0" x="22" y="58" width="760" height="22" fill="#1F1E1D"/><text class="t" x="24" y="102"><tspan class="p">●</tspan> AI/ML engineer and blockchain developer.</text><rect class="c1" x="22" y="86" width="760" height="22" fill="#1F1E1D"/><text class="t" x="24" y="130"><tspan class="p">●</tspan> AI: LLM agents, multi-agent pipelines, MCP servers</text><rect class="c2" x="22" y="114" width="760" height="22" fill="#1F1E1D"/><text class="t" x="24" y="158"><tspan class="p">●</tspan> ML: PyTorch, secure MLOps, LLM guardrails</text><rect class="c3" x="22" y="142" width="760" height="22" fill="#1F1E1D"/><text class="t" x="24" y="186"><tspan class="p">●</tspan> Chain: Solana tx firewall, Solidity, EVM wallets</text><rect class="c4" x="22" y="170" width="760" height="22" fill="#1F1E1D"/><text class="t" x="24" y="214"><tspan class="p">●</tspan> Building NoteDM (AI video) and SignSafeli (AI x Solana)</text><rect class="c5" x="22" y="198" width="760" height="22" fill="#1F1E1D"/><text class="t" x="24" y="242"><tspan class="ok">✓</tspan> Open to AI and Web3 collaborations.</text><rect class="c6" x="22" y="226" width="760" height="22" fill="#1F1E1D"/>
<text class="t p" x="24" y="270">~ $</text>
