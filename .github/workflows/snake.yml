name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D97757&color_dots=#ebedf0,#F5D5C8,#EBA88F,#D97757,#A8492A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D97757&color_dots=#2A2826,#5C3A2E,#8A4B35,#B85F40,#D97757&color_background=#1F1E1D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
